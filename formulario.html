<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <div class="caja">
    <h1>Formulario de datos personales</h1>

    <form action="#" method="get">
      <fieldset>
        <legend>Datos personales</legend>

        Escribe tu nombre:<br>
        <input type="text" name="nombre" maxlength="40"><br><br>

        Escribe tus apellidos:<br>
        <input type="text" name="apellidos" maxlength="40"><br><br>

        Selecciona tu edad:<br>
        <input type="number" name="edad"><br><br>

        Selecciona el color favorito:<br>
        <input type="color" name="color"><br><br>

        <input type="submit" value="Enviar datos">
        <input type="reset" value="Limpiar">
      </fieldset>
    </form>

    <p><a href="index.html" class="btn">Volver al menú</a></p>
  </div>
</body>
</html>
