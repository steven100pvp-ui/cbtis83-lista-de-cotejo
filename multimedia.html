<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imagen, Video y Audio</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <div class="caja">
    <h1>Ejemplo: Imagen, Video y Audio</h1>

    <h2>1. Imagen</h2>
    <p>Se usa la etiqueta &lt;img&gt;</p>
    <img src="media/gato.jpg" alt="Gato" width="300">

    <h2>2. Video</h2>
    <p>Se usa la etiqueta &lt;video&gt;</p>
    <video width="400" controls>
      <source src="media/video.mp4" type="video/mp4">
      Tu navegador no soporta video.
    </video>

    <h2>3. Audio</h2>
    <p>Se usa la etiqueta &lt;audio&gt;</p>
    <audio controls>
      <source src="media/audio.mp3" type="audio/mpeg">
      Tu navegador no soporta audio.
    </audio>

    <br><br>
    <p><a href="index.html" class="btn">Volver al menú</a></p>
  </div>
</body>
</html>
